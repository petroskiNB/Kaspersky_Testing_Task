apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-lab
spec:
  replicas: 1
  progressDeadlineSeconds: 7200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # A Service named vllm injects VLLM_PORT=tcp://... by default,
      # conflicting with vLLM's numeric internal port setting. Use DNS instead.
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download-model
          image: llm-downloader:v0.2
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: model-download-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-credentials
                  key: token
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: downloader-home
              mountPath: /home/app
            - name: downloader-tmp
              mountPath: /tmp
      containers:
        - name: vllm
          image: llm-lab:v0.3
          imagePullPolicy: Never
          # Keep the image ENTRYPOINT (vllm serve); replace only CMD.
          args: ["--config", "/etc/llm/server.yaml"]
          envFrom:
            - configMapRef:
                name: vllm-environment
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: token
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 10Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: server-config
              mountPath: /etc/llm
              readOnly: true
            - name: server-home
              mountPath: /home/app
            - name: server-tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-storage
        - name: server-config
          configMap:
            name: vllm-config
        - name: server-home
          emptyDir: {}
        - name: server-tmp
          emptyDir: {}
        - name: downloader-home
          emptyDir: {}
        - name: downloader-tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
