apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: llm-lab
data:
  # Mount as /etc/llm/server.yaml and run:
  # vllm serve --config /etc/llm/server.yaml
  # The downloader must populate the PVC's qwen/ directory first.
  server.yaml: |
    model: /models/qwen
    served-model-name: qwen
    host: 0.0.0.0
    port: 8000
    dtype: bfloat16
    max-model-len: 2048
    max-num-seqs: 2
    enforce-eager: true
    enable-log-requests: false
    enable-log-outputs: false
    disable-uvicorn-access-log: true
    log-config-file: /app/config/logging.json
    middleware:
      - app.request_logging.RequestMetadataMiddleware
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-environment
  namespace: llm-lab
data:
  OMP_NUM_THREADS: "4"
  VLLM_CPU_OMP_THREADS_BIND: nobind
  VLLM_CPU_KVCACHE_SPACE: "1"
  HF_HUB_OFFLINE: "1"
  VLLM_NO_USAGE_STATS: "1"
  HF_HOME: /home/app/.cache/huggingface
  VLLM_LOGGING_CONFIG_PATH: /app/config/logging.json
  PYTHONPATH: /app
